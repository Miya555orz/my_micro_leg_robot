source [find interface/cmsis-dap.cfg]
source [find target/stm32h7x.cfg]
adapter speed 4000

# 控制块在 0x2401D4F8 → AXI SRAM 基址 0x24000000, 选择覆盖 512KB (0x00080000)
set RTT_BASE 0x24000000
set RTT_SIZE 0x00080000
set RTT_ID   "SEGGER RTT"

proc scan_rtt {} {
    echo "RTT scan attempt (base=$::RTT_BASE size=$::RTT_SIZE)..."
    if {[catch { rtt setup $::RTT_BASE $::RTT_SIZE $::RTT_ID } err]} {
        echo "rtt setup failed: $err"
        return
    }
    if {[catch { rtt start } err]} {
        echo "rtt start failed: $err"
        return
    }
    if {[catch { rtt server start 9100 0 } err]} {
        echo "rtt server start failed: $err"
    }
    rtt status
}

init
reset init


